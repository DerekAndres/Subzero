<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Subzero</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --ice:#00BCD4; --ice-d:#00ACC1; --ice-bg:#E0F7FA;
    --s900:#0F172A; --s800:#1E293B; --s700:#334155;
    --s600:#475569; --s400:#94A3B8; --s200:#E2E8F0; --s100:#F1F5F9;
    --white:#FFF; --ok:#10B981; --warn:#F59E0B; --err:#EF4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#F6FEFF;color:var(--s800)}

  /* ── Layout ── */
  .layout{display:flex;min-height:100vh}
  .sidebar{width:240px;background:var(--s900);padding:28px 20px;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar-logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--white);margin-bottom:32px}
  .sidebar-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--s400);margin-bottom:10px;margin-top:20px}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--s400);font-size:14px;font-weight:500;cursor:pointer;transition:all 200ms;background:none;border:none;width:100%;text-align:left;margin-bottom:4px}
  .nav-btn:hover{background:rgba(255,255,255,.08);color:var(--white)}
  .nav-btn.active{background:rgba(0,188,212,.15);color:#67E8F9}
  .sidebar-footer{margin-top:auto;padding-top:16px}
  .logout-btn{width:100%;background:rgba(239,68,68,.15);color:#FCA5A5;border:none;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:background 200ms}
  .logout-btn:hover{background:rgba(239,68,68,.25)}

  /* ── Main ── */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{background:var(--white);border-bottom:1px solid var(--s200);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  .topbar-title{font-size:18px;font-weight:700;color:var(--s900)}
  .topbar-user{font-size:13px;color:var(--s400)}
  .content{padding:32px;flex:1}

  /* ── Section visibility ── */
  .section{display:none}
  .section.active{display:block}

  /* ── Stats ── */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
  .stat-card{background:var(--white);border-radius:14px;padding:20px 22px;border:1px solid var(--s200)}
  .stat-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--s400);margin-bottom:8px}
  .stat-value{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--s900)}
  .stat-sub{font-size:12px;color:var(--s400);margin-top:4px}

  /* ── Tabs ── */
  .tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
  .tab-btn{padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;border:2px solid var(--s200);cursor:pointer;transition:all 200ms;background:var(--white);color:var(--s600);display:flex;align-items:center;gap:6px}
  .tab-btn.active{background:var(--ice);color:var(--white);border-color:var(--ice)}
  .tab-badge{background:rgba(255,255,255,.3);border-radius:99px;padding:1px 7px;font-size:11px}
  .tab-btn:not(.active) .tab-badge{background:var(--s200);color:var(--s600)}

  /* ── Orders ── */
  .orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .order-card{background:var(--white);border-radius:14px;border:1px solid var(--s200);overflow:hidden;transition:box-shadow 200ms}
  .order-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .order-card.nuevo{border-left:4px solid var(--err);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
  .order-head{padding:16px 18px;border-bottom:1px solid var(--s100);display:flex;align-items:center;justify-content:space-between}
  .order-id{font-size:13px;font-weight:700;color:var(--s900)}
  .order-time{font-size:12px;color:var(--s400)}
  .status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px}
  .status-ESPERANDO_PAGO{background:#FEF3C7;color:#92400E;border:1px solid #FCD34D}
  .status-PENDIENTE{background:#FEF9C3;color:#92400E}
  .status-EN_PREPARACION{background:#FEF3C7;color:#92400E}
  .status-LISTO{background:#D1FAE5;color:#065F46}
  .status-ENTREGADO{background:var(--s100);color:var(--s400)}
  .action-warn{background:#FEF3C7;color:#92400E}
  .action-warn:hover{background:#FDE68A}
  .order-body{padding:14px 18px}
  .order-client{font-size:13px;font-weight:600;color:var(--s700);margin-bottom:2px}
  .order-email{font-size:12px;color:var(--s400);margin-bottom:12px}
  .order-items{font-size:13px;color:var(--s600);line-height:1.6;margin-bottom:12px}
  .order-total{font-size:15px;font-weight:700;color:var(--ice-d)}
  .order-actions{padding:14px 18px;border-top:1px solid var(--s100);display:flex;gap:8px}
  .action-btn{flex:1;padding:9px;border-radius:99px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all 200ms}
  .action-primary{background:var(--ice);color:var(--white)}
  .action-primary:hover{background:var(--ice-d)}
  .action-secondary{background:var(--s100);color:var(--s600)}
  .action-secondary:hover{background:var(--s200)}
  .action-success{background:#D1FAE5;color:#065F46}
  .action-success:hover{background:#A7F3D0}
  .empty-state{text-align:center;padding:60px 24px;color:var(--s400);font-size:14px}

  /* ── Menu management ── */
  .menu-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .menu-header h2{font-size:17px;font-weight:700;color:var(--s900)}
  .add-btn{background:var(--ice);color:var(--white);border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 200ms}
  .add-btn:hover{background:var(--ice-d)}

  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .item-card{background:var(--white);border-radius:14px;border:1px solid var(--s200);padding:18px;display:flex;flex-direction:column;gap:10px;transition:box-shadow 200ms}
  .item-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .item-card.inactive{opacity:.55}
  .item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .item-name{font-size:15px;font-weight:700;color:var(--s900)}
  .item-price{font-size:14px;font-weight:600;color:var(--ice-d)}
  .item-desc{font-size:12px;color:var(--s400);line-height:1.5}
  .item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ice-bg);color:var(--ice-d)}
  .active-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
  .dot-on{background:var(--ok)}
  .dot-off{background:var(--err)}
  .color-chip{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
  .item-actions{display:flex;gap:8px;margin-top:4px}
  .btn-edit{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;border:1.5px solid var(--s200);background:var(--white);color:var(--s700);cursor:pointer;transition:all 200ms}
  .btn-edit:hover{border-color:var(--ice);color:var(--ice)}
  .btn-toggle{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all 200ms}
  .btn-toggle.on{background:#FEE2E2;color:#991B1B}
  .btn-toggle.on:hover{background:#FECACA}
  .btn-toggle.off{background:#D1FAE5;color:#065F46}
  .btn-toggle.off:hover{background:#A7F3D0}
  .btn-del{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;border:none;background:#FEE2E2;color:#991B1B;cursor:pointer;transition:all 200ms}
  .btn-del:hover{background:#FECACA}

  /* ── Modal ── */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;opacity:0;pointer-events:none;transition:opacity 200ms}
  .overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--white);border-radius:20px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;transform:translateY(20px);transition:transform 200ms}
  .overlay.open .modal{transform:translateY(0)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .modal-title{font-size:17px;font-weight:800;color:var(--s900)}
  .modal-close{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--s200);background:var(--s100);color:var(--s600);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 160ms;flex-shrink:0}
  .modal-close:hover{background:#FEE2E2;border-color:#FECACA;color:#991B1B}
  .img-preview{width:100%;height:120px;border-radius:10px;border:1.5px dashed var(--s200);object-fit:cover;display:none;margin-bottom:6px}
  .img-preview.show{display:block}
  .form-group{margin-bottom:16px}
  .form-label{font-size:12px;font-weight:600;color:var(--s600);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px}
  .form-input{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--s200);font-size:14px;color:var(--s900);font-family:'Inter',sans-serif;transition:border 200ms;background:var(--white)}
  .form-input:focus{outline:none;border-color:var(--ice)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:10px;margin-top:24px}
  .btn-save{flex:1;background:var(--ice);color:var(--white);border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:background 200ms}
  .btn-save:hover{background:var(--ice-d)}
  .btn-cancel{flex:1;background:var(--s100);color:var(--s600);border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:background 200ms}
  .btn-cancel:hover{background:var(--s200)}
  .color-preview-row{display:flex;align-items:center;gap:10px}
  .color-big{width:36px;height:36px;border-radius:8px;border:1px solid var(--s200);flex-shrink:0}

  /* ── Extras picker ── */
  .extras-picker{display:flex;flex-direction:column;gap:14px;margin-top:4px}
  .ep-cat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--s400);margin-bottom:6px}
  .ep-chips{display:flex;flex-wrap:wrap;gap:6px}
  .ep-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:2px solid var(--s200);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;transition:all 160ms;color:var(--s600);font-family:'Inter',sans-serif}
  .ep-chip:hover{border-color:var(--ice);color:var(--ice-d)}
  .ep-chip.selected{border-color:var(--ice);background:var(--ice-bg);color:var(--ice-d)}
  .ep-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .ep-empty{font-size:12px;color:var(--s400);font-style:italic}

  /* ── Toast ── */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--s900);color:var(--white);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;transform:translateY(80px);opacity:0;transition:all 300ms}
  .toast.show{transform:translateY(0);opacity:1}

  @media(max-width:768px){
    .sidebar{display:none}
    .stats-grid{grid-template-columns:1fr 1fr}
    .content{padding:20px}
  }
</style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo"><img src="../assets/img/logo.png" alt="Subzero" style="height:80px;object-fit:contain;filter:brightness(0) invert(1)"></div>

    <div class="sidebar-label">Cocina</div>
    <button class="nav-btn active" id="nav-pedidos" onclick="showSection('pedidos')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Pedidos
    </button>

    <div class="sidebar-label">Inventario</div>
    <button class="nav-btn" id="nav-productos" onclick="showSection('productos')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg>
      Productos
    </button>
    <button class="nav-btn" id="nav-extras" onclick="showSection('extras')">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Extras / Toppings
    </button>

    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="pageTitle">Pedidos en Tiempo Real</div>
      <div class="topbar-user" id="adminUser">Cargando...</div>
    </div>

    <div class="content">

      <!-- ═══════════ SECCIÓN PEDIDOS ═══════════ -->
      <div id="sec-pedidos" class="section active">
        <div class="stats-grid">
          <div class="stat-card" style="border-left:4px solid var(--warn)">
            <div class="stat-label">Esperando pago</div>
            <div class="stat-value" id="cnt-ESPERANDO_PAGO">—</div>
            <div class="stat-sub">Transferencias</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pendientes</div>
            <div class="stat-value" id="cnt-PENDIENTE">—</div>
            <div class="stat-sub">Por atender</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">En preparación</div>
            <div class="stat-value" id="cnt-EN_PREPARACION">—</div>
            <div class="stat-sub">En cocina</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Listos</div>
            <div class="stat-value" id="cnt-LISTO">—</div>
            <div class="stat-sub">Para entregar</div>
          </div>
        </div>

        <div class="tabs">
          <button class="tab-btn"        id="tab-ESPERANDO_PAGO" onclick="filtrarPedidos('ESPERANDO_PAGO',this)">⏳ Transferencias <span class="tab-badge" id="badge-ESPERANDO_PAGO">0</span></button>
          <button class="tab-btn active" id="tab-PENDIENTE"      onclick="filtrarPedidos('PENDIENTE',this)">Pendientes <span class="tab-badge" id="badge-PENDIENTE">0</span></button>
          <button class="tab-btn"        id="tab-EN_PREPARACION" onclick="filtrarPedidos('EN_PREPARACION',this)">En preparación <span class="tab-badge" id="badge-EN_PREPARACION">0</span></button>
          <button class="tab-btn"        id="tab-LISTO"          onclick="filtrarPedidos('LISTO',this)">Listos <span class="tab-badge" id="badge-LISTO">0</span></button>
          <button class="tab-btn"        id="tab-ENTREGADO"      onclick="filtrarPedidos('ENTREGADO',this)">Historial</button>
        </div>

        <div class="orders-grid" id="ordersGrid">
          <div class="empty-state">Cargando pedidos...</div>
        </div>
      </div>

      <!-- ═══════════ SECCIÓN PRODUCTOS ═══════════ -->
      <div id="sec-productos" class="section">
        <div class="menu-header">
          <h2>Productos del Menú</h2>
          <button class="add-btn" onclick="openModal('producto',null)">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Agregar producto
          </button>
        </div>
        <div class="items-grid" id="productosGrid">
          <div class="empty-state">Cargando...</div>
        </div>
      </div>

      <!-- ═══════════ SECCIÓN EXTRAS ═══════════ -->
      <div id="sec-extras" class="section">
        <div class="menu-header">
          <h2 id="extrasTitle">Extras</h2>
          <button class="add-btn" onclick="openModal('extra',null)">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Agregar
          </button>
        </div>
        <div class="tabs">
          <button class="tab-btn active" onclick="filtrarExtras('tamaños',this)">Tamaños</button>
          <button class="tab-btn"        onclick="filtrarExtras('sabores',this)">Sabores</button>
          <button class="tab-btn"        onclick="filtrarExtras('gomitas',this)">Gomitas</button>
          <button class="tab-btn"        onclick="filtrarExtras('toppings',this)">Toppings</button>
        </div>
        <div class="items-grid" id="extrasGrid">
          <div class="empty-state">Cargando...</div>
        </div>
      </div>

    </div><!-- /content -->
  </div><!-- /main -->
</div><!-- /layout -->

<!-- ═══════════ MODAL ═══════════ -->
<div class="overlay" id="overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Agregar</div>
      <button class="modal-close" onclick="closeModal()" title="Cerrar">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Campos comunes -->
    <div class="form-group">
      <label class="form-label">Nombre</label>
      <input class="form-input" id="f-nombre" type="text" placeholder="Ej: Raspado Grande">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" id="lbl-precio">Precio (Lps.)</label>
        <input class="form-input" id="f-precio" type="number" min="0" placeholder="2500">
      </div>
      <div class="form-group" id="grp-orden" style="display:none">
        <label class="form-label">Orden</label>
        <input class="form-input" id="f-orden" type="number" min="1" placeholder="1">
      </div>
    </div>

    <!-- Solo productos -->
    <div id="grp-producto-fields">
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <input class="form-input" id="f-desc" type="text" placeholder="Opcional">
      </div>
      <div class="form-group">
        <label class="form-label">Badge (etiqueta)</label>
        <input class="form-input" id="f-badge" type="text" placeholder="Ej: Popular, Nuevo…">
      </div>
      <div class="form-group">
        <label class="form-label">URL de imagen (opcional)</label>
        <img class="img-preview" id="imgPreview" alt="Preview">
        <input class="form-input" id="f-imagen" type="url" placeholder="https://… (pega el link de la imagen)" oninput="previewImg(this.value)">
      </div>
    </div>

    <!-- Extras del producto (solo modo producto) -->
    <div id="grp-extras" style="display:none">
      <div class="form-group">
        <label class="form-label">Extras disponibles para este producto</label>
        <div class="extras-picker" id="extrasPicker">
          <div class="ep-empty">Cargando extras...</div>
        </div>
      </div>
    </div>

    <!-- Color (solo sabores) -->
    <div id="grp-color" style="display:none">
      <div class="form-group">
        <label class="form-label">Color del raspado</label>
        <div class="color-preview-row">
          <div class="color-big" id="colorPreview" style="background:#00BCD4"></div>
          <input class="form-input" id="f-color" type="color" value="#00BCD4" style="width:60px;height:40px;padding:2px 4px;cursor:pointer" oninput="document.getElementById('colorPreview').style.background=this.value">
          <input class="form-input" id="f-color-hex" type="text" placeholder="#00BCD4" style="flex:1" oninput="syncColor(this.value)">
        </div>
      </div>
    </div>

    <!-- Emoji (solo toppings) -->
    <div id="grp-icon" style="display:none">
      <div class="form-group">
        <label class="form-label">Emoji / Ícono</label>

    <div class="modal-actions">

<div class="toast" id="toast"></div>

<script type="module">
import { auth, db } from "../assets/js/firebase-config.js";
import {
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  collection, query, where, orderBy, onSnapshot, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ══════════════════════════════════════════
//  FIRESTORE REST API — bypasses WebSocket
// ══════════════════════════════════════════
const PROJECT_ID  = "subzero-2d5eb";
const FSTORE_BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

// ─── Auth guard ─────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (!user) { window.location.replace("login.html"); return; }
  document.getElementById("adminUser").textContent = user.email + " · " + PROJECT_ID;
});
document.getElementById("logoutBtn").addEventListener("click", () =>
  signOut(auth).then(() => window.location.replace("login.html"))
);

function toFsValue(v) {
  if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return { nullValue: null };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number')  return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  return { stringValue: String(v) };
}
function toFsDoc(data) {
  return { fields: Object.fromEntries(Object.entries(data).map(([k,v]) => [k, toFsValue(v)])) };
}

// Fetch with 8-second abort timeout
async function timedFetch(url, opts) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 8000);
  try {
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error("Tiempo agotado: la red no responde (¿extensión bloqueando Google?)");
    throw e;
  } finally {
    clearTimeout(tid);
  }
}

// getIdToken() without forceRefresh=true — uses cached token, no extra network call
async function getToken() {
  const user = auth.currentUser;
  if (!user) throw new Error("Sin sesión activa — recarga e inicia sesión de nuevo.");
  return user.getIdToken(); // cached; refreshes only when token expires
}

async function restAdd(col, data) {
  const token = await getToken();
  console.log("[REST] POST", col, data);
  const res = await timedFetch(`${FSTORE_BASE}/${col}`, {
    method:  'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body:    JSON.stringify(toFsDoc(data)),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    console.error("[REST] error", res.status, e);
    throw Object.assign(new Error(e.error?.message || `Error HTTP ${res.status}`),
      { code: res.status === 403 ? 'permission-denied' : 'unavailable' });
  }
  const r = await res.json();
  console.log("[REST] OK", r.name);
  return r;
}
async function restUpdate(col, id, data) {
  const token = await getToken();
  console.log("[REST] PATCH", col, id, data);
  const mask = Object.keys(data).map(k => `updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
  const res = await timedFetch(`${FSTORE_BASE}/${col}/${id}?${mask}`, {
    method:  'PATCH',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body:    JSON.stringify(toFsDoc(data)),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    console.error("[REST] error", res.status, e);
    throw Object.assign(new Error(e.error?.message || `Error HTTP ${res.status}`),
      { code: res.status === 403 ? 'permission-denied' : 'unavailable' });
  }
  return res.json();
}
async function restDelete(col, id) {
  const token = await getToken();
  const res = await timedFetch(`${FSTORE_BASE}/${col}/${id}`, {
    method:  'DELETE',
    headers: { 'Authorization': `Bearer ${token}` },
  });
  if (!res.ok && res.status !== 404) {
    const e = await res.json().catch(() => ({}));
    throw Object.assign(new Error(e.error?.message || `Error HTTP ${res.status}`),
      { code: res.status === 403 ? 'permission-denied' : 'unavailable' });
  }
}

// ══════════════════════════════════════════
//  PEDIDOS
// ══════════════════════════════════════════
let allOrders = [];
let estadoActivo = "PENDIENTE";
let prevIds = new Set();

const hoyInicio = new Date(); hoyInicio.setHours(0,0,0,0);
onSnapshot(
  query(collection(db,"pedidos"), where("fecha",">=",Timestamp.fromDate(hoyInicio)), orderBy("fecha","desc")),
  snap => {
    allOrders = snap.docs.map(d => ({ id:d.id, ...d.data() }));

    const nuevos = allOrders.filter(o =>
      (o.estado === "PENDIENTE" || o.estado === "ESPERANDO_PAGO") && !prevIds.has(o.id)
    );
    if (nuevos.length && prevIds.size > 0) {
      const hayTransf = nuevos.some(o => o.estado === "ESPERANDO_PAGO");
      document.title = hayTransf
        ? `🏦 ¡Transferencia pendiente! — Dashboard`
        : `🔔 ¡${nuevos.length} nuevo(s)! — Dashboard`;
      setTimeout(() => { document.title = "Dashboard — Subzero"; }, 6000);
    }
    prevIds = new Set(allOrders.map(o => o.id));
    actualizarContadores();
    renderPedidos();
  }
);

function actualizarContadores() {
  ["ESPERANDO_PAGO","PENDIENTE","EN_PREPARACION","LISTO","ENTREGADO"].forEach(e => {
    const cnt = allOrders.filter(o => o.estado === e).length;
    const el  = document.getElementById(`cnt-${e}`);
    const b   = document.getElementById(`badge-${e}`);
    if (el) el.textContent = cnt;
    if (b)  b.textContent  = cnt;
    // Resaltar tab de transferencias si hay pedidos esperando
    const tabEl = document.getElementById(`tab-${e}`);
    if (e === "ESPERANDO_PAGO" && tabEl) {
      tabEl.style.borderColor = cnt > 0 ? "var(--warn)" : "";
      tabEl.style.color       = cnt > 0 ? "#92400E"     : "";
    }
  });
}

function renderPedidos() {
  const grid     = document.getElementById("ordersGrid");
  const filtered = allOrders.filter(o => o.estado === estadoActivo);
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state">No hay pedidos en este estado.</div>`;
    return;
  }
  grid.innerHTML = filtered.map(o => {
    const hora = (o.fecha?.toDate?.() || new Date()).toLocaleTimeString("es-CR",{hour:"2-digit",minute:"2-digit"});
    const itemsHTML = (o.items||[]).map(i =>
      `<div>• ${i.nombre}${i.meta ? ` <span style="color:var(--s400)">(${i.meta})</span>` : ""}</div>`
    ).join("");
    const metodoBadge = o.metodoPago
      ? `<span style="font-size:10px;background:var(--s100);color:var(--s600);border-radius:99px;padding:2px 8px;font-weight:600;margin-left:6px;">${o.metodoPago}</span>`
      : "";
    const acciones = {
      ESPERANDO_PAGO: `<button class="action-btn action-warn" onclick="confirmarTransferencia('${o.id}')">✅ Confirmar transferencia</button>`,
      PENDIENTE:      `<button class="action-btn action-primary" onclick="cambiarEstado('${o.id}','EN_PREPARACION')">Empezar preparación</button>`,
      EN_PREPARACION: `<button class="action-btn action-success" onclick="cambiarEstado('${o.id}','LISTO')">Marcar LISTO</button>`,
      LISTO:          `<button class="action-btn action-primary" onclick="cambiarEstado('${o.id}','ENTREGADO')">Marcar ENTREGADO</button>`,
      ENTREGADO:      `<button class="action-btn action-secondary" disabled>Completado ✓</button>`,
    };
    return `
      <div class="order-card ${o.estado==='PENDIENTE'?'nuevo':''}">
        <div class="order-head">
          <div>
            <div class="order-id">Pedido #${o.id.slice(-6).toUpperCase()}</div>
            <div class="order-time">${hora}</div>
          </div>
          <span class="status-badge status-${o.estado}">${o.estado.replace(/_/g," ")}</span>
        </div>
        <div class="order-body">
          <div class="order-client">${o.clienteNombre||"Cliente"}${metodoBadge}</div>
          <div class="order-email">${o.clienteEmail||""}</div>
          <div class="order-items">${itemsHTML||"Sin detalle"}</div>
          <div class="order-total">Lps.${(o.total||0).toLocaleString()}</div>
        </div>
        <div class="order-actions">${acciones[o.estado]||""}</div>
      </div>`;
  }).join("");
}

window.cambiarEstado = async (id, estado) => {
  try {
    await restUpdate("pedidos", id, { estado });
  } catch (err) { showToast("Error: " + err.message); }
};

window.confirmarTransferencia = async (id) => {
  if (!confirm("¿Confirmar que recibiste el comprobante de transferencia? Se notificará al cliente con su número de pedido.")) return;
  try {
    await restUpdate("pedidos", id, { estado: "PENDIENTE" });
    showToast("Transferencia confirmada ✓ — se enviará email al cliente");
  } catch (err) { showToast("Error: " + err.message); }
};
window.filtrarPedidos = (estado, btn) => {
  estadoActivo = estado;
  document.querySelectorAll(".tabs .tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderPedidos();
};

// ══════════════════════════════════════════
//  PRODUCTOS
// ══════════════════════════════════════════
let productos = [];

onSnapshot(
  query(collection(db,"productos"), orderBy("orden")),
  snap => {

      `<div class="empty-state" style="color:#EF4444">Error al cargar: ${err.message}<br><small>Actualiza las reglas de Firestore en Firebase Console.</small></div>`;
  }
);

function renderProductos() {

    <div class="item-card ${p.activo===false?'inactive':''}">
      ${p.imagen ? `<img src="${esc(p.imagen)}" alt="${esc(p.nombre)}" style="width:100%;height:100px;object-fit:cover;border-radius:10px;margin-bottom:10px">` : ""}
      <div class="item-top">
        <div>
          <div class="item-name">${esc(p.nombre)}</div>
          <div class="item-price">Lps.${(p.precio_base||0).toLocaleString()}</div>

        <div class="active-dot ${p.activo!==false?'dot-on':'dot-off'}" title="${p.activo!==false?'Activo':'Inactivo'}"></div>
      </div>
      ${p.descripcion ? `<div class="item-desc">${esc(p.descripcion)}</div>` : ""}
      <div class="item-meta">
        ${p.badge ? `<span class="badge-pill">${esc(p.badge)}</span>` : ""}
        ${p.extrasIds?.length ? `<span class="badge-pill" style="background:#E0F7FA;color:#00838F">${p.extrasIds.length} extras</span>` : `<span class="badge-pill" style="background:#FEF9C3;color:#92400E">Sin extras</span>`}
        <span style="font-size:11px;color:var(--s400)">Orden: ${p.orden||"—"}</span>
      </div>
      <div class="item-actions">
        <button class="btn-edit" onclick='editItem("producto",${JSON.stringify({id:p.id,nombre:p.nombre,precio_base:p.precio_base,descripcion:p.descripcion||"",badge:p.badge||"",imagen:p.imagen||"",orden:p.orden||1,activo:p.activo!==false,extrasIds:p.extrasIds||[]})})'>Editar</button>
        <button class="btn-toggle ${p.activo!==false?'on':'off'}" onclick="toggleItem('productos','${p.id}',${p.activo!==false})">
          ${p.activo!==false?'Desactivar':'Activar'}
        </button>
        <button class="btn-del" onclick="deleteItem('productos','${p.id}','${esc(p.nombre)}')">✕</button>

// ══════════════════════════════════════════
//  EXTRAS
// ══════════════════════════════════════════
let extras = [];
let categoriaActiva = "tamaños";

onSnapshot(
  query(collection(db,"extras"), orderBy("nombre")),
  snap => {
    extras = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderExtras();
  }
);

function renderExtras() {
  const grid = document.getElementById("extrasGrid");
  const filtered = extras.filter(e => e.categoria === categoriaActiva);
  document.getElementById("extrasTitle").textContent = {
    "tamaños":"Tamaños","sabores":"Sabores","gomitas":"Gomitas","toppings":"Toppings"
  }[categoriaActiva] || "Extras";

  }
  grid.innerHTML = filtered.map(e => `
    <div class="item-card ${e.activo===false?'inactive':''}">

        <div style="display:flex;align-items:center;gap:8px">
          ${e.icon ? `<span style="font-size:20px">${e.icon}</span>` : ""}
          ${e.color||e.c1 ? `<div class="color-chip" style="background:${e.color||e.c1}"></div>` : ""}
          <div>
            <div class="item-name">${esc(e.nombre)}</div>
            <div class="item-price">+Lps.${(e.precio||0).toLocaleString()}</div>
          </div>
        </div>
        <div class="active-dot ${e.activo!==false?'dot-on':'dot-off'}"></div>
      </div>
      <div class="item-actions">
        <button class="btn-edit" onclick='editItem("extra",${JSON.stringify({id:e.id,nombre:e.nombre,precio:e.precio||0,color:e.color||e.c1||"#00BCD4",icon:e.icon||"",categoria:e.categoria,activo:e.activo!==false})})'>Editar</button>
        <button class="btn-toggle ${e.activo!==false?'on':'off'}" onclick="toggleItem('extras','${e.id}',${e.activo!==false})">
          ${e.activo!==false?'Desactivar':'Activar'}
        </button>
        <button class="btn-del" onclick="deleteItem('extras','${e.id}','${esc(e.nombre)}')">✕</button>

window.filtrarExtras = (cat, btn) => {
  categoriaActiva = cat;
  document.querySelectorAll("#sec-extras .tabs .tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderExtras();
};

// ══════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════
let modalMode = null;   // 'producto' | 'extra'
let editingId = null;

window.openModal = (mode, data) => {
  modalMode = mode;
  editingId = data?.id || null;

  document.getElementById("modalTitle").textContent = editingId
    ? (mode==="producto" ? "Editar Producto" : "Editar Extra")
    : (mode==="producto" ? "Nuevo Producto"  : `Nuevo: ${categoriaActiva}`);

  // Reset
  ["f-nombre","f-precio","f-desc","f-badge","f-icon","f-color-hex","f-imagen"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  document.getElementById("f-orden").value = "";
  const prev = document.getElementById("imgPreview");
  prev.classList.remove("show"); prev.src = "";
  document.getElementById("f-color").value = "#00BCD4";
  document.getElementById("colorPreview").style.background = "#00BCD4";

  // Campos visibles según modo
  const isProducto = mode === "producto";
  const isSabor    = !isProducto && categoriaActiva === "sabores";
  const isTopping  = !isProducto && categoriaActiva === "toppings";

  document.getElementById("grp-producto-fields").style.display = isProducto ? "block" : "none";
  document.getElementById("grp-orden").style.display            = isProducto ? "flex"  : "none";
  document.getElementById("grp-color").style.display            = isSabor    ? "block" : "none";
  document.getElementById("grp-icon").style.display             = isTopping  ? "block" : "none";
  document.getElementById("grp-extras").style.display           = isProducto ? "block" : "none";
  document.getElementById("lbl-precio").textContent = isProducto ? "Precio base (Lps.)" : "Precio extra (Lps.)";
  if (isProducto) _buildExtrasPicker(data?.extrasIds || []);

  // Rellena con data existente
  if (data) {
    document.getElementById("f-nombre").value = data.nombre || "";
    document.getElementById("f-precio").value = data.precio_base ?? data.precio ?? "";
    if (isProducto) {
      document.getElementById("f-desc").value   = data.descripcion || "";
      document.getElementById("f-badge").value  = data.badge || "";
      document.getElementById("f-orden").value  = data.orden || "";
      document.getElementById("f-imagen").value = data.imagen || "";
      if (data.imagen) {
        const prev = document.getElementById("imgPreview");
        prev.src = data.imagen; prev.classList.add("show");
      }
    }
    if (isSabor && data.color) {
      document.getElementById("f-color").value    = data.color;
      document.getElementById("f-color-hex").value = data.color;
      document.getElementById("colorPreview").style.background = data.color;
    }
    if (isTopping) document.getElementById("f-icon").value = data.icon || "";
  }

  // Ocultar error previo
  const errEl = document.getElementById("modalError");
  if (errEl) errEl.style.display = "none";

  document.getElementById("overlay").classList.add("open");
  document.getElementById("f-nombre").focus();
};

window.closeModal    = () => document.getElementById("overlay").classList.remove("open");
window.closeModalOutside = e => { if (e.target.id==="overlay") closeModal(); };
window.editItem      = (mode, data) => openModal(mode, data);

function _buildExtrasPicker(selectedIds) {
  const picker = document.getElementById("extrasPicker");
  const cats = [
    { key:"sabores",  label:"Sabores"  },
    { key:"gomitas",  label:"Gomitas"  },
    { key:"toppings", label:"Toppings" },
  ];
  const html = cats.map(({ key, label }) => {
    const items = extras.filter(e => e.categoria === key && e.activo !== false);
    if (!items.length) return "";
    const chips = items.map(e => {
      const sel = selectedIds.includes(e.id) ? "selected" : "";
      const dot = e.color ? `<span class="ep-dot" style="background:${esc(e.color)}"></span>` : "";
      const icon = e.icon ? `${esc(e.icon)} ` : "";
      return `<button type="button" class="ep-chip ${sel}" data-extra-id="${e.id}"
        onclick="this.classList.toggle('selected')">${dot}${icon}${esc(e.nombre)}</button>`;
    }).join("");
    return `<div><div class="ep-cat-label">${label}</div><div class="ep-chips">${chips}</div></div>`;
  }).join("");
  picker.innerHTML = html || `<div class="ep-empty">Sin extras configurados aún. Agrégalos desde la sección Extras.</div>`;
}

window.handleSave = async () => {
  const errEl   = document.getElementById("modalError");
  const btnSave = document.getElementById("btnSave");

  const showErr = (msg) => {
    if (errEl) { errEl.innerHTML = msg; errEl.style.display = "block"; }
    if (btnSave) { btnSave.textContent = "Guardar"; btnSave.disabled = false; }
  };

  if (errEl) errEl.style.display = "none";
  if (btnSave) { btnSave.textContent = "Guardando..."; btnSave.disabled = true; }

  const nombre = document.getElementById("f-nombre").value.trim();
  const precio = parseFloat(document.getElementById("f-precio").value);
  if (!nombre) { showErr("Escribe el nombre del producto."); return; }
  if (isNaN(precio) || precio < 0) { showErr("Escribe un precio válido."); return; }

  let saved = false;
  try {
    if (modalMode === "producto") {
      const orden  = parseInt(document.getElementById("f-orden").value) || (productos.length + 1);
      const imagen = document.getElementById("f-imagen").value.trim();
      const extrasIds = [...document.querySelectorAll('#extrasPicker .ep-chip.selected')]
        .map(el => el.dataset.extraId);
      const data   = {
        nombre:      nombre,
        precio_base: precio,
        descripcion: document.getElementById("f-desc").value.trim(),
        badge:       document.getElementById("f-badge").value.trim(),
        orden:       orden,
        activo:      true,
        extrasIds:   extrasIds,
      };
      if (imagen) data.imagen = imagen;

      if (editingId) {
        await restUpdate("productos", editingId, data);
      } else {
        await restAdd("productos", data);
      }

    } else {
      const data = { nombre, precio, categoria: categoriaActiva, activo: true };
      if (categoriaActiva === "sabores") {
        const color = document.getElementById("f-color").value;
        data.color = color; data.c1 = color;
      }
      if (categoriaActiva === "toppings") {
        data.icon = document.getElementById("f-icon").value.trim();
      }
      if (editingId) {
        await restUpdate("extras", editingId, data);
      } else {
        await restAdd("extras", data);
      }
    }

    saved = true;

  } catch (err) {
    console.error("[handleSave] error:", err.code, err.message, err);
    let msg = err.message || "Error desconocido";
    if (err.code === "permission-denied") {
      msg = "Sin permisos de escritura en Firebase. Revisa las reglas de Firestore.";
    }
    showErr(msg);
  } finally {
    if (btnSave) { btnSave.textContent = "Guardar"; btnSave.disabled = false; }
  }

  if (saved) {
    closeModal();
    showToast("¡Guardado correctamente! ✓");
  }
};

window.toggleItem = async (col, id, activo) => {
  try {
    await restUpdate(col, id, { activo: !activo });
    showToast(activo ? "Desactivado" : "Activado");
  } catch (err) { showToast("Error: " + err.message); }
};

window.deleteItem = async (col, id, nombre) => {
  if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`)) return;
  try {
    await restDelete(col, id);
    showToast("Eliminado ✓");
  } catch (err) { showToast("Error al eliminar: " + err.message); }
};

// ══════════════════════════════════════════

const sections = { pedidos:"Pedidos en Tiempo Real", productos:"Productos del Menú", extras:"Extras / Toppings" };

window.showSection = id => {
  Object.keys(sections).forEach(k => {
    document.getElementById(`sec-${k}`).classList.toggle("active", k===id);
    document.getElementById(`nav-${k}`).classList.toggle("active", k===id);
  });
  document.getElementById("pageTitle").textContent = sections[id];

// ══════════════════════════════════════════
//  UTILS

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

window.previewImg = (url) => {
  const prev = document.getElementById("imgPreview");
  if (url && url.startsWith("http")) {
    prev.src = url; prev.classList.add("show");
  } else {
    prev.classList.remove("show"); prev.src = "";
  }
};

let toastTimer;
window.showToast = msg => {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
};

window.syncColor = hex => {
  if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
    document.getElementById("f-color").value = hex;
    document.getElementById("colorPreview").style.background = hex;
  }
};
</script>
