<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito — Subzero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ice-500: #00BCD4; --ice-600: #00ACC1; --ice-50: #E0F7FA;
    --ice-100: #B2EBF2; --slate-900: #0F172A; --slate-800: #1E293B;
    --slate-600: #475569; --slate-400: #94A3B8; --slate-200: #E2E8F0;
    --slate-100: #F1F5F9; --white: #FFFFFF; --success: #10B981;
    --error: #EF4444; --shadow-md: 0 4px 16px rgba(0,188,212,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F6FEFF; color: var(--slate-800); }
  .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
  .page-header {
    background: var(--white); border-bottom: 1px solid var(--slate-200);
    padding: 20px 0; position: sticky; top: 0; z-index: 10;
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--slate-900); text-decoration: none; }
  .back-link { font-size: 14px; color: var(--ice-600); font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .main { padding: 40px 0 80px; }
  .page-title { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; color: var(--slate-900); margin-bottom: 32px; }
  .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 28px; align-items: start; }
  .cart-list { background: var(--white); border-radius: 16px; border: 1px solid var(--slate-200); overflow: hidden; }
  .cart-item {
    display: flex; gap: 16px; align-items: center;
    padding: 20px 24px; border-bottom: 1px solid var(--slate-100);
  }
  .cart-item:last-child { border-bottom: none; }
  .item-thumb {
    width: 64px; height: 64px; border-radius: 12px; background: var(--ice-50);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .item-thumb svg { width: 36px; height: 36px; }
  .item-name { font-size: 15px; font-weight: 600; color: var(--slate-900); margin-bottom: 4px; }
  .item-meta { font-size: 12px; color: var(--slate-400); line-height: 1.5; }
  .item-price { font-size: 16px; font-weight: 700; color: var(--ice-600); margin-left: auto; white-space: nowrap; }
  .item-remove {
    background: none; border: none; cursor: pointer; padding: 6px;
    color: var(--slate-300); border-radius: 6px; transition: all 200ms;
  }
  .item-remove:hover { color: var(--error); background: #FEF2F2; }
  .empty-state {
    padding: 60px 24px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    color: var(--slate-400);
  }
  .empty-state svg { opacity: 0.25; }
  .empty-state p { font-size: 16px; font-weight: 500; }
  .empty-state a {
    margin-top: 8px; background: var(--ice-500); color: var(--white);
    padding: 12px 24px; border-radius: 99px; font-size: 14px; font-weight: 600;
    text-decoration: none; transition: background 200ms;
  }
  .empty-state a:hover { background: var(--ice-600); }
  .order-card { background: var(--white); border-radius: 16px; border: 1px solid var(--slate-200); padding: 28px; position: sticky; top: 90px; }
  .order-title { font-size: 16px; font-weight: 700; color: var(--slate-900); margin-bottom: 24px; }
  .order-lines { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .order-line { display: flex; justify-content: space-between; font-size: 14px; color: var(--slate-600); }
  .order-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; color: var(--slate-900); padding-top: 16px; border-top: 2px solid var(--slate-100); margin-bottom: 24px; }
  .order-total span:last-child { color: var(--ice-600); }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--slate-600); margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%; padding: 11px 14px; border: 2px solid var(--slate-200);
    border-radius: 10px; font-size: 14px; font-family: inherit;
    transition: border-color 200ms; background: var(--white); color: var(--slate-800);
  }
  .form-input:focus { outline: none; border-color: var(--ice-500); }
  .pay-btn {
    width: 100%; background: var(--slate-900); color: var(--white); border: none;
    border-radius: 99px; padding: 16px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 200ms;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .pay-btn:hover { background: var(--ice-600); box-shadow: 0 6px 20px rgba(0,188,212,.35); }
  .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .secure-note { text-align: center; font-size: 12px; color: var(--slate-400); margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  @media (max-width: 768px) {
    .cart-layout { grid-template-columns: 1fr; }
    .order-card { position: static; }
  }
</style>
</head>
<body>
<header class="page-header">
  <div class="container">
    <div class="header-inner">
      <a href="index.html" class="logo">SUBZERO</a>
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        Volver al menú
      </a>
    </div>
  </div>
</header>

<main class="main">
  <div class="container">
    <h1 class="page-title">Tu carrito</h1>
    <div class="cart-layout">

      <!-- Lista de items -->
      <div class="cart-list" id="cartList">
        <div class="empty-state" id="emptyState">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <p>Tu carrito está vacío</p>
          <a href="index.html">Ver catálogo</a>
        </div>
      </div>

      <!-- Formulario + resumen -->
      <aside class="order-card">
        <div class="order-title">Resumen del pedido</div>
        <div class="order-lines" id="orderLines"></div>
        <div class="order-total">
          <span>Total</span>
          <span id="orderTotal">₡0</span>
        </div>

        <form id="checkoutForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="nombre">Nombre completo *</label>
            <input class="form-input" type="text" id="nombre" name="nombre" placeholder="Juan Pérez" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Correo electrónico * <small style="font-weight:400">(para tu factura)</small></label>
            <input class="form-input" type="email" id="email" name="email" placeholder="juan@correo.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="telefono">Teléfono</label>
            <input class="form-input" type="tel" id="telefono" name="telefono" placeholder="8888-8888">
          </div>

          <button type="submit" class="pay-btn" id="payBtn" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 15h0M12 15h0M17 15h0"/></svg>
            Pagar con BAC Credomatic
          </button>
          <p class="secure-note">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Pago 100% seguro · SSL cifrado
          </p>
        </form>
      </aside>
    </div>
  </div>
</main>

<script type="module">
import { iniciarPago } from "./assets/js/checkout.js";
import { getCart, removeItem, getTotal } from "./assets/js/cart.js";

function render() {
  const cart = getCart();
  const list = document.getElementById("cartList");
  const empty = document.getElementById("emptyState");
  const lines = document.getElementById("orderLines");
  const totalEl = document.getElementById("orderTotal");
  const payBtn = document.getElementById("payBtn");

  if (!cart.length) {
    list.innerHTML = "";
    list.appendChild(empty);
    lines.innerHTML = "";
    totalEl.textContent = "₡0";
    payBtn.disabled = true;
    return;
  }

  list.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="item-thumb">
        <svg viewBox="0 0 36 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 26L5 40h26l-3-14H8z" fill="#E0F7FA"/>
          <ellipse cx="18" cy="26" rx="13" ry="8" fill="white"/>
          <ellipse cx="18" cy="18" rx="12" ry="10" fill="#67E8F9" opacity=".7"/>
          <ellipse cx="18" cy="12" rx="8" ry="6" fill="#00BCD4" opacity=".8"/>
        </svg>
      </div>
      <div style="flex:1">
        <div class="item-name">${item.nombre}</div>
        <div class="item-meta">${item.meta || ""}</div>
      </div>
      <div class="item-price">₡${item.precio.toLocaleString()}</div>
      <button class="item-remove" onclick="removeItem(${item.id})" aria-label="Eliminar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
    </div>
  `).join("");

  lines.innerHTML = cart.map(i => `
    <div class="order-line">
      <span>${i.nombre}</span>
      <span>₡${i.precio.toLocaleString()}</span>
    </div>
  `).join("");

  const total = getTotal();
  totalEl.textContent = `₡${total.toLocaleString()}`;
  payBtn.disabled = false;
}

window.removeItem = (id) => { import("./assets/js/cart.js").then(m => { m.removeItem(id); render(); }); };
window.addEventListener("cart-updated", render);

document.getElementById("checkoutForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("payBtn");
  btn.disabled = true;
  btn.textContent = "Procesando...";
  try {
    await iniciarPago({
      nombre:   document.getElementById("nombre").value,
      email:    document.getElementById("email").value,
      telefono: document.getElementById("telefono").value,
    });
  } catch (err) {
    alert("Error al procesar el pago: " + err.message);
    btn.disabled = false;
    btn.textContent = "Pagar con BAC Credomatic";
  }
});

render();
</script>
</body>
</html>
