<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmación de pedido — Subzero</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --ice-500:#00BCD4; --ice-600:#00ACC1; --ice-50:#E0F7FA; --ice-100:#B2EBF2; --slate-900:#0F172A; --slate-600:#475569; --slate-200:#E2E8F0; --white:#FFFFFF; --success:#10B981; --error:#EF4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F6FEFF; color: var(--slate-900); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .card { background: var(--white); border-radius: 24px; border: 1px solid var(--slate-200); padding: 52px 44px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 12px 40px rgba(0,188,212,.10); }
  .icon-circle { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 28px; display: flex; align-items: center; justify-content: center; }
  .icon-success { background: #DCFCE7; }
  .icon-error   { background: #FEE2E2; }
  .card-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 12px; }
  .card-desc  { font-size: 15px; color: var(--slate-600); line-height: 1.65; margin-bottom: 32px; }
  .info-box { background: var(--ice-50); border: 1px solid var(--ice-100); border-radius: 14px; padding: 20px 24px; margin-bottom: 28px; text-align: left; }
  .info-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--slate-600); padding: 6px 0; }
  .info-row strong { color: var(--slate-900); }
  .steps-note { font-size: 13px; color: var(--slate-600); background: var(--slate-200); border-radius: 10px; padding: 14px 18px; margin-bottom: 28px; text-align: left; line-height: 1.65; }
  .steps-note b { color: var(--slate-900); }
  .btn-home { display: inline-flex; align-items: center; gap: 8px; background: var(--ice-500); color: var(--white); padding: 14px 28px; border-radius: 99px; font-size: 15px; font-weight: 600; text-decoration: none; transition: background 200ms; }
  .btn-home:hover { background: var(--ice-600); }
</style>
</head>
<body>
<div class="card" id="mainCard">
  <!-- contenido inyectado por JS -->
</div>

<script type="module">
import { manejarRetornoPago } from "./assets/js/checkout.js";
import { db } from "./assets/js/firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const { exito, pedidoId, motivo } = manejarRetornoPago();
const card = document.getElementById("mainCard");

if (exito) {
  // Cargar datos del pedido desde Firestore
  let pedidoInfo = {};
  if (pedidoId) {
    const snap = await getDoc(doc(db, "pedidos", pedidoId));
    if (snap.exists()) pedidoInfo = snap.data();
  }

  card.innerHTML = `
    <div class="icon-circle icon-success">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 class="card-title">¡Pedido confirmado!</h1>
    <p class="card-desc">Tu pago fue aprobado. En unos minutos recibirás la factura en tu correo electrónico.</p>
    ${pedidoId ? `
    <div class="info-box">
      <div class="info-row"><span>Número de pedido</span><strong>#${pedidoId.slice(-6).toUpperCase()}</strong></div>
      <div class="info-row"><span>Estado</span><strong style="color:#F59E0B">En preparación</strong></div>
      ${pedidoInfo.clienteEmail ? `<div class="info-row"><span>Factura enviada a</span><strong>${pedidoInfo.clienteEmail}</strong></div>` : ""}
      ${pedidoInfo.total ? `<div class="info-row"><span>Total cobrado</span><strong style="color:#00ACC1">₡${pedidoInfo.total.toLocaleString()}</strong></div>` : ""}
    </div>` : ""}
    <div class="steps-note">
      <b>¿Qué sigue?</b><br>
      Nuestro equipo ya recibió tu pedido y está preparando tu Subzero. Te avisaremos cuando esté listo para recoger.
    </div>
    <a href="index.html" class="btn-home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Volver al inicio
    </a>
  `;
} else {
  card.innerHTML = `
    <div class="icon-circle icon-error">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <h1 class="card-title">Pago no procesado</h1>
    <p class="card-desc">${motivo}. Tu carrito sigue guardado, puedes intentarlo de nuevo.</p>
    <a href="carrito.html" class="btn-home" style="background:#EF4444">Volver al carrito</a>
  `;
}
</script>
</body>
</html>
